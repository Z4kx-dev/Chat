<html class="page" lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat</title>

    <link rel="stylesheet" href="./static/style.css">
</head>

<body>

    <header class="cabecalho">
        <h1 class="titulo">Korczak</h1>

        <button id="entrar">Entrar</button>
        <button id="Cadastrar">Cadastrar</button>
    </header>

    <main id="chat">

        <section id="conversas">
            <div class="cabecalho-conversas">
                <h1 id="titulo-conversas">Conversas</h1>
            </div>
        </section>

        <section class="painel">

            <div id="cabecalho-painel">
                <h1 class="nome">Lucas</h1>

                <button class="ligar" type="button">Ligar</button>
                <button class="configurações-conversa" type="button">Config.</button>
            </div>

            <div class="background">

                <div class="mensagens"></div>

                <div class="Enviar-Mensagem">
                    <textarea class="caixa-mensagem" placeholder="Digite sua mensagem..."></textarea>
                    <button type="submit" class="envio">&gt;</button>
                </div>

            </div>

        </section>

    </main>

    <script src="./static/script.js"></script>


</body></html>
